name: Sync releases from upstream

# 手动触发：Actions 页点 "Run workflow" 即同步一次（已同步的版本自动跳过）
on:
  workflow_dispatch:

# 允许在本仓库创建 Release
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: Yu9191/wloc
    steps:
      # 先把本仓库拉到运行环境里，否则 gh 创建 Release 时找不到 git 会报错
      - uses: actions/checkout@v4
      - name: Mirror all upstream releases
        run: |
          set -e
          for tag in $(gh release list -R "$UPSTREAM" --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" -R "${{ github.repository }}" > /dev/null 2>&1; then
              echo "== $tag 已存在，跳过"
              continue
            fi
            echo "== 正在同步 $tag"
            dir=$(mktemp -d)
            # 取上游的标题和说明文字（说明文件放在附件目录之外，免得被当附件传上去）
            title=$(gh release view "$tag" -R "$UPSTREAM" --json name --jq '.name')
            notes=$(mktemp)
            gh release view "$tag" -R "$UPSTREAM" --json body --jq '.body' > "$notes"
            extra=""
            if [ "$(gh release view "$tag" -R "$UPSTREAM" --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
              extra="--prerelease"
            fi
            # 先数附件：无附件的 Release（如 wloc v1.1.0）直接下载会报错退出，必须分开处理
            count=$(gh release view "$tag" -R "$UPSTREAM" --json assets --jq '.assets | length')
            if [ "$count" -gt 0 ]; then
              # 下载该版本的全部附件（ipa 等），不含源码包（源码包本仓库会自动生成）
              gh release download "$tag" -R "$UPSTREAM" --dir "$dir"
              # 在本仓库创建同名 Release 并上传附件
              gh release create "$tag" "$dir"/* --title "${title:-$tag}" --notes-file "$notes" $extra
            else
              echo "== $tag 无附件，只建空 Release"
              gh release create "$tag" --title "${title:-$tag}" --notes-file "$notes" $extra
            fi
            echo "== $tag 同步完成"
          done
          echo "全部同步完毕"
